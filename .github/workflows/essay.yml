name: Essay browser checks

on:
  push:
    branches: [main]
    paths:
      - 'essay/src/**'
      - 'essay/test/**'
      - 'essay/scripts/**'
      - 'essay/package*.json'
      - 'essay/tsconfig.json'
      - '.github/workflows/essay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    name: Essay · ${{ matrix.engine }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    defaults:
      run:
        working-directory: essay
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: essay/package-lock.json
      - name: Install pinned development dependencies
        run: npm ci
      - name: Install browser and system dependencies
        run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Check types
        run: npm run typecheck
      - name: Check exact arithmetic and navigation
        run: npm test
      - name: Build the standalone HTML
        run: npm run build
      - name: Check the browser experience
        run: npm run test:browser
        env:
          BROWSER_ENGINE: ${{ matrix.engine }}
      - name: Save screenshots on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: essay-${{ matrix.engine }}-screenshots
          path: essay/qa/
          if-no-files-found: ignore
          retention-days: 7
